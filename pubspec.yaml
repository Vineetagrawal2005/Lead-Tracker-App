name: lead_tracker
description: "A small sales CRM for salespeople - track leads, add notes, and manage follow-ups."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  intl: ^0.19.0
  crypto: ^3.0.5
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  go_router: ^14.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
